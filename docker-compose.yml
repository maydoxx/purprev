
services:
  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

  web:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "bunx vite build && bunx vite preview --host 0.0.0.0 --port 5173 --strictPort"]
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  dbdata:
