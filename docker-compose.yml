services:
  db:
    image: docker.io/library/mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_HOST: db
      MARIADB_PORT: "3306"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

  web:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "bunx vite build && bunx vite preview --host 0.0.0.0 --port 5173 --strictPort"]
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  dbdata:
